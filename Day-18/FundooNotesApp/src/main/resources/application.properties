# Server Configuration
server.port=8083

# Spring Application Name
spring.application.name=FundooNotesApp

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:fundoodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Artemis JMS Configuration (Embedded Mode)
spring.artemis.mode=embedded

# Redis Data Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Logging Level for Security & Redis Debug Verification
logging.level.com.fundoo.notes.security=DEBUG


