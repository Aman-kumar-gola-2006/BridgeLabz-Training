# Server Configuration
server.port=8083

# Spring Application Name
spring.application.name=FundooNotesApp

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:fundoodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=9a2f8c4e7b1a3d5e6f8c0b2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f
app.jwt.expiration-ms=86400000
app.jwt.reset-expiration-ms=900000

# Swagger OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
